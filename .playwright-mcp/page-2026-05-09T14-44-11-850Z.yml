      - generic [ref=e969]: "Gere uma imagem 1024x1536 (vertical) com fundo TRANSPARENTE (PNG), estilo render 3D AAA hiper-realista de jogo de futebol mobile (igual cards lendários do FIFA Ultimate Team / EA Sports FC). Sem moldura, sem texto, sem logos. PERSONAGEM: jogador de futebol masculino, jovem, brasileiro, pele morena, cabelo curto castanho escuro. CORPO COMPLETO visível (cabeça aos pés). POSE ÉPICA DE AÇÃO — sprintando em alta velocidade vindo da esquerda pra direita, perna direita estendida na frente em passada longa, perna esquerda atrás dobrada, braços bombando em corrida (um pra frente, um pra trás), tronco levemente inclinado pra frente em postura agressiva e poderosa. EXPRESSÃO de fúria/foco intenso (tipo Ronaldo de Lima na corrida). Músculos tensionados. UNIFORME: camisa branca lisa simples, shorts pretos lisos, meiões brancos longos, chuteiras pretas dramáticas (sem números, sem escudo, sem texto). EFEITOS VISUAIS DRAMÁTICOS ao redor do corpo: - Aura energética dourada/laranja saindo das costas (motion blur de velocidade) - Faíscas e partículas de luz suspensas no ar - Pequenos rastros de fogo/energia atrás dos pés - Respingo de luz onde os pés tocam (impacto) - Iluminação cinematográfica vinda de cima e atrás (rim light dourado realçando a silhueta) Composição centralizada, jogador ocupando 80% do frame. Renderização nível PlayStation 5 / next-gen, ultra detalhada. Imagem para ser usada como hero em tela de loading de jogo mobile."
